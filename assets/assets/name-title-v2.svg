<svg width="760" height="118" viewBox="0 0 760 118" xmlns="http://www.w3.org/2000/svg">

  <defs>
    <filter id="glow" x="-40%" y="-80%" width="180%" height="260%">
      <feGaussianBlur stdDeviation="2.2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <clipPath id="slice1">
      <rect x="220" y="36" width="320" height="8"/>
    </clipPath>

    <clipPath id="slice2">
      <rect x="220" y="47" width="320" height="9"/>
    </clipPath>

    <clipPath id="slice3">
      <rect x="220" y="59" width="320" height="7"/>
    </clipPath>

    <clipPath id="slice4">
      <rect x="220" y="69" width="320" height="8"/>
    </clipPath>

    <linearGradient id="bottomLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#30363d" stop-opacity="0"/>
      <stop offset="35%" stop-color="#30363d"/>
      <stop offset="50%" stop-color="#ff3131"/>
      <stop offset="65%" stop-color="#30363d"/>
      <stop offset="100%" stop-color="#30363d" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <style>
    .top {
      font-family: "JetBrains Mono", "Cascadia Code", "Consolas", monospace;
      font-size: 10px;
      letter-spacing: 1.4px;
      fill: #8b949e;
    }

    .name {
      font-family: "Segoe UI", Arial, sans-serif;
      font-size: 40px;
      font-weight: 800;
      letter-spacing: .4px;
      fill: #f0f6fc;
    }

    .red {
      font-family: "Segoe UI", Arial, sans-serif;
      font-size: 40px;
      font-weight: 800;
      letter-spacing: .4px;
      fill: #ff3131;
      filter: url(#glow);
    }

    .sub {
      font-family: "JetBrains Mono", "Cascadia Code", "Consolas", monospace;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: .35px;
      fill: #ff3131;
    }
  </style>

  <line x1="100" y1="17" x2="660" y2="17" stroke="#30363d"/>

  <text x="380" y="13" text-anchor="middle" class="top">
    developer profile
  </text>

  <!-- glow base -->
  <text x="380" y="68" text-anchor="middle" class="red" opacity=".15">
    Nogueira
    <animate
      attributeName="opacity"
      values=".08;.22;.10;.28;.08"
      dur="2.8s"
      repeatCount="indefinite"
    />
  </text>

  <!-- nome principal -->
  <text x="380" y="68" text-anchor="middle" class="name">
    Nogueira
    <animate
      attributeName="opacity"
      values="1;1;.86;1;1;.90;1"
      keyTimes="0;.24;.26;.29;.66;.69;1"
      dur="3.2s"
      repeatCount="indefinite"
    />
  </text>

  <!-- glitch slice 1 -->
  <g clip-path="url(#slice1)">
    <text x="380" y="68" text-anchor="middle" class="red">
      Nogueira
      <animateTransform
        attributeName="transform"
        type="translate"
        values="0 0;0 0;12 0;-8 0;4 0;0 0;0 0"
        keyTimes="0;.18;.20;.22;.24;.27;1"
        dur="2.6s"
        repeatCount="indefinite"
        calcMode="discrete"
      />
      <animate
        attributeName="opacity"
        values="0;0;.95;.80;.55;0;0"
        keyTimes="0;.18;.20;.22;.24;.27;1"
        dur="2.6s"
        repeatCount="indefinite"
      />
    </text>
  </g>

  <!-- glitch slice 2 -->
  <g clip-path="url(#slice2)">
    <text x="380" y="68" text-anchor="middle" class="red">
      Nogueira
      <animateTransform
        attributeName="transform"
        type="translate"
        values="0 0;0 0;-13 0;9 0;-3 0;0 0;0 0"
        keyTimes="0;.47;.49;.51;.53;.56;1"
        dur="3.1s"
        repeatCount="indefinite"
        calcMode="discrete"
      />
      <animate
        attributeName="opacity"
        values="0;0;.92;.75;.45;0;0"
        keyTimes="0;.47;.49;.51;.53;.56;1"
        dur="3.1s"
        repeatCount="indefinite"
      />
    </text>
  </g>

  <!-- glitch slice 3 -->
  <g clip-path="url(#slice3)">
    <text x="380" y="68" text-anchor="middle" class="red">
      Nogueira
      <animateTransform
        attributeName="transform"
        type="translate"
        values="0 0;0 0;14 0;-10 0;5 0;0 0;0 0"
        keyTimes="0;.70;.72;.74;.76;.79;1"
        dur="2.9s"
        repeatCount="indefinite"
        calcMode="discrete"
      />
      <animate
        attributeName="opacity"
        values="0;0;.98;.82;.48;0;0"
        keyTimes="0;.70;.72;.74;.76;.79;1"
        dur="2.9s"
        repeatCount="indefinite"
      />
    </text>
  </g>

  <!-- glitch slice 4 -->
  <g clip-path="url(#slice4)">
    <text x="380" y="68" text-anchor="middle" class="red">
      Nogueira
      <animateTransform
        attributeName="transform"
        type="translate"
        values="0 0;0 0;-11 0;8 0;-4 0;0 0;0 0"
        keyTimes="0;.31;.33;.35;.37;.40;1"
        dur="3.7s"
        repeatCount="indefinite"
        calcMode="discrete"
      />
      <animate
        attributeName="opacity"
        values="0;0;.90;.72;.42;0;0"
        keyTimes="0;.31;.33;.35;.37;.40;1"
        dur="3.7s"
        repeatCount="indefinite"
      />
    </text>
  </g>

  <!-- pequenos flashes glitch -->
  <rect x="230" y="43" width="18" height="2" fill="#ff3131" opacity="0">
    <animate attributeName="opacity" values="0;1;0;0" dur="1.8s" repeatCount="indefinite"/>
  </rect>

  <rect x="515" y="55" width="22" height="2" fill="#ff3131" opacity="0">
    <animate attributeName="opacity" values="0;0;1;0" dur="2.4s" repeatCount="indefinite"/>
  </rect>

  <rect x="255" y="70" width="26" height="2" fill="#ff3131" opacity="0">
    <animate attributeName="opacity" values="0;1;0;0" dur="3s" repeatCount="indefinite"/>
  </rect>

  <!-- cursor mais perto do nome -->
  <rect x="505" y="37" width="7" height="33" rx="1.5" fill="#ff3131" filter="url(#glow)">
    <animate
      attributeName="opacity"
      values="1;1;0;0;1"
      dur="1s"
      repeatCount="indefinite"
    />
  </rect>

  <text x="380" y="94" text-anchor="middle" class="sub">
    full-stack developer · OH Team
  </text>

  <line
    x1="245"
    y1="106"
    x2="515"
    y2="106"
    stroke="url(#bottomLine)"
  />

  <rect x="330" y="105" width="100" height="2" rx="1" fill="#ff3131">
    <animate
      attributeName="opacity"
      values=".35;1;.35"
      dur="2.4s"
      repeatCount="indefinite"
    />
  </rect>

</svg>
