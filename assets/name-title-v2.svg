<svg width="760" height="118" viewBox="0 0 760 118" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="glow" x="-40%" y="-80%" width="180%" height="260%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <clipPath id="slice1">
      <rect x="225" y="40" width="305" height="7"/>
    </clipPath>

    <clipPath id="slice2">
      <rect x="225" y="51" width="305" height="8"/>
    </clipPath>

    <clipPath id="slice3">
      <rect x="225" y="63" width="305" height="7"/>
    </clipPath>

    <linearGradient id="bottomLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#30363d" stop-opacity="0"/>
      <stop offset="35%" stop-color="#30363d"/>
      <stop offset="50%" stop-color="#ff3131"/>
      <stop offset="65%" stop-color="#30363d"/>
      <stop offset="100%" stop-color="#30363d" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <style>
    .top {
      font-family: "JetBrains Mono", "Cascadia Code", "Consolas", monospace;
      font-size: 10px;
      letter-spacing: 1.3px;
      fill: #8b949e;
    }

    .name {
      font-family: "Segoe UI", Arial, sans-serif;
      font-size: 40px;
      font-weight: 800;
      letter-spacing: .35px;
      fill: #f0f6fc;
    }

    .red {
      font-family: "Segoe UI", Arial, sans-serif;
      font-size: 40px;
      font-weight: 800;
      letter-spacing: .35px;
      fill: #ff3131;
      filter: url(#glow);
    }

    .sub {
      font-family: "JetBrains Mono", "Cascadia Code", "Consolas", monospace;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: .35px;
      fill: #ff3131;
    }
  </style>

  <line x1="100" y1="17" x2="660" y2="17" stroke="#30363d"/>

  <text x="380" y="13" text-anchor="middle" class="top">
    developer profile
  </text>

  <!-- glow base -->
  <text x="380" y="68" text-anchor="middle" class="red" opacity=".13">
    Nogueira
    <animate
      attributeName="opacity"
      values=".08;.16;.10;.18;.08"
      dur="3s"
      repeatCount="indefinite"
    />
  </text>

  <!-- nome principal -->
  <text x="380" y="68" text-anchor="middle" class="name">
    Nogueira
    <animate
      attributeName="opacity"
      values="1;1;.93;1;1;.95;1"
      keyTimes="0;.25;.27;.30;.67;.70;1"
      dur="3.2s"
      repeatCount="indefinite"
    />
  </text>

  <!-- glitch clean 1 -->
  <g clip-path="url(#slice1)">
    <text x="380" y="68" text-anchor="middle" class="red">
      Nogueira
      <animateTransform
        attributeName="transform"
        type="translate"
        values="0 0;0 0;7 0;-4 0;2 0;0 0;0 0"
        keyTimes="0;.16;.18;.20;.22;.25;1"
        dur="2.8s"
        repeatCount="indefinite"
        calcMode="discrete"
      />
      <animate
        attributeName="opacity"
        values="0;0;.75;.55;.25;0;0"
        keyTimes="0;.16;.18;.20;.22;.25;1"
        dur="2.8s"
        repeatCount="indefinite"
      />
    </text>
  </g>

  <!-- glitch clean 2 -->
  <g clip-path="url(#slice2)">
    <text x="380" y="68" text-anchor="middle" class="red">
      Nogueira
      <animateTransform
        attributeName="transform"
        type="translate"
        values="0 0;0 0;-8 0;5 0;-2 0;0 0;0 0"
        keyTimes="0;.46;.48;.50;.52;.55;1"
        dur="3.4s"
        repeatCount="indefinite"
        calcMode="discrete"
      />
      <animate
        attributeName="opacity"
        values="0;0;.72;.50;.20;0;0"
        keyTimes="0;.46;.48;.50;.52;.55;1"
        dur="3.4s"
        repeatCount="indefinite"
      />
    </text>
  </g>

  <!-- glitch clean 3 -->
  <g clip-path="url(#slice3)">
    <text x="380" y="68" text-anchor="middle" class="red">
      Nogueira
      <animateTransform
        attributeName="transform"
        type="translate"
        values="0 0;0 0;8 0;-5 0;2 0;0 0;0 0"
        keyTimes="0;.72;.74;.76;.78;.81;1"
        dur="3s"
        repeatCount="indefinite"
        calcMode="discrete"
      />
      <animate
        attributeName="opacity"
        values="0;0;.78;.58;.22;0;0"
        keyTimes="0;.72;.74;.76;.78;.81;1"
        dur="3s"
        repeatCount="indefinite"
      />
    </text>
  </g>

  <!-- detalhes sutis -->
  <rect x="245" y="45" width="14" height="1.5" rx="0.75" fill="#ff3131" opacity="0">
    <animate attributeName="opacity" values="0;0.9;0;0" dur="2.3s" repeatCount="indefinite"/>
  </rect>

  <rect x="500" y="57" width="16" height="1.5" rx="0.75" fill="#ff3131" opacity="0">
    <animate attributeName="opacity" values="0;0;0.85;0" dur="2.8s" repeatCount="indefinite"/>
  </rect>

  <!-- cursor mais perto e um pouco mais baixo -->
  <rect x="490" y="39" width="7" height="32" rx="1.5" fill="#ff3131" filter="url(#glow)">
    <animate
      attributeName="opacity"
      values="1;1;0;0;1"
      dur="1s"
      repeatCount="indefinite"
    />
  </rect>

  <text x="380" y="94" text-anchor="middle" class="sub">
    full-stack developer · OH Team
  </text>

  <line
    x1="245"
    y1="106"
    x2="515"
    y2="106"
    stroke="url(#bottomLine)"
  />

  <rect x="330" y="105" width="100" height="2" rx="1" fill="#ff3131">
    <animate
      attributeName="opacity"
      values=".35;1;.35"
      dur="2.5s"
      repeatCount="indefinite"
    />
  </rect>
</svg>
