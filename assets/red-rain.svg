<svg width="1000" height="112" viewBox="0 0 1000 112" xmlns="http://www.w3.org/2000/svg">

  <defs>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset=".08" stop-color="#fff" stop-opacity=".55"/>
      <stop offset=".22" stop-color="#fff" stop-opacity="1"/>
      <stop offset=".78" stop-color="#fff" stop-opacity="1"/>
      <stop offset=".94" stop-color="#fff" stop-opacity=".45"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>

    <mask id="fade-mask">
      <rect width="1000" height="112" fill="url(#fade)"/>
    </mask>

    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="soft-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation=".55" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <style>
      text {
        font-family: "JetBrains Mono", "Fira Code", "Cascadia Code", Consolas, monospace;
        font-size: 13px;
      }

      .r1 {
        fill: #ff3131;
        opacity: .38;
      }

      .r2 {
        fill: #ff3131;
        opacity: .68;
        filter: url(#soft-glow);
      }

      .r3 {
        fill: #ff3131;
        opacity: .95;
        filter: url(#glow);
      }

      .head {
        fill: #f0f6fc;
        opacity: .98;
        filter: url(#glow);
      }

      .tiny {
        font-size: 11px;
      }

      .big {
        font-size: 14px;
      }
    </style>
  </defs>

  <g mask="url(#fade-mask)">

    <g class="r2">
      <text x="18" y="-62">01010110</text>
      <text x="18" y="-43">0x2F</text>
      <text x="18" y="-24">10100101</text>
      <text class="head" x="18" y="-5">exec()</text>

      <animateTransform
        attributeName="transform"
        type="translate"
        from="0 0"
        to="0 178"
        dur="6.2s"
        repeatCount="indefinite"
      />
    </g>

    <g class="r1 tiny">
      <text x="79" y="-96">sudo</text>
      <text x="79" y="-78">chmod +x</text>
      <text x="79" y="-60">./run</text>
      <text x="79" y="-42">011001</text>
      <text class="head" x="79" y="-24">bash</text>

      <animateTransform
        attributeName="transform"
        type="translate"
        from="0 0"
        to="0 215"
        dur="8.8s"
        repeatCount="indefinite"
      />
    </g>

    <g class="r3 big">
      <text x="145" y="-82">while(1)</text>
      <text x="145" y="-62">{</text>
      <text x="145" y="-42">exec();</text>
      <text x="145" y="-22">}</text>
      <text class="head" x="145" y="-2">0xDEAD</text>

      <animateTransform
        attributeName="transform"
        type="translate"
        from="0 0"
        to="0 195"
        dur="7.1s"
        repeatCount="indefinite"
      />
    </g>

    <g class="r2">
      <text x="215" y="-54">00101101</text>
      <text x="215" y="-35">fork()</text>
      <text x="215" y="-16">pipe()</text>
      <text class="head" x="215" y="3">exec()</text>

      <animateTransform
        attributeName="transform"
        type="translate"
        from="0 0"
        to="0 165"
        dur="5.6s"
        repeatCount="indefinite"
      />
    </g>

    <g class="r1">
      <text x="282" y="-105">/dev/null</text>
      <text x="282" y="-86">100101</text>
      <text x="282" y="-67">root</text>
      <text x="282" y="-48">stdin</text>
      <text x="282" y="-29">stdout</text>
      <text class="head" x="282" y="-10">0x00</text>

      <animateTransform
        attributeName="transform"
        type="translate"
        from="0 0"
        to="0 225"
        dur="9.3s"
        repeatCount="indefinite"
      />
    </g>

    <g class="r3">
      <text x="350" y="-72">printf()</text>
      <text x="350" y="-53">0110</text>
      <text x="350" y="-34">0xFF</text>
      <text class="head" x="350" y="-15">return 0;</text>

      <animateTransform
        attributeName="transform"
        type="translate"
        from="0 0"
        to="0 185"
        dur="5.2s"
        repeatCount="indefinite"
      />
    </g>

    <g class="r1 tiny">
      <text x="418" y="-116">10101010</text>
      <text x="418" y="-98">fork()</text>
      <text x="418" y="-80">NULL</text>
      <text x="418" y="-62">malloc()</text>
      <text x="418" y="-44">free()</text>
      <text class="head" x="418" y="-26">0x13</text>

      <animateTransform
        attributeName="transform"
        type="translate"
        from="0 0"
        to="0 238"
        dur="10.1s"
        repeatCount="indefinite"
      />
    </g>

    <g class="r2 big">
      <text x="482" y="-66">payload</text>
      <text x="482" y="-46">101101</text>
      <text x="482" y="-26">socket()</text>
      <text class="head" x="482" y="-6">connect()</text>

      <animateTransform
        attributeName="transform"
        type="translate"
        from="0 0"
        to="0 180"
        dur="6.5s"
        repeatCount="indefinite"
      />
    </g>

    <g class="r3">
      <text x="554" y="-100">access()</text>
      <text x="554" y="-81">110011</text>
      <text x="554" y="-62">sudo</text>
      <text x="554" y="-43">passwd</text>
      <text x="554" y="-24">shell</text>
      <text class="head" x="554" y="-5">uid=0</text>

      <animateTransform
        attributeName="transform"
        type="translate"
        from="0 0"
        to="0 212"
        dur="8.1s"
        repeatCount="indefinite"
      />
    </g>

    <g class="r2">
      <text x="624" y="-61">eth0</text>
      <text x="624" y="-42">192.168.1.1</text>
      <text x="624" y="-23">ssh</text>
      <text class="head" x="624" y="-4">22/tcp</text>

      <animateTransform
        attributeName="transform"
        type="translate"
        from="0 0"
        to="0 175"
        dur="5.9s"
        repeatCount="indefinite"
      />
    </g>

    <g class="r1 tiny">
      <text x="700" y="-121">hashcat</text>
      <text x="700" y="-103">0xC0DE</text>
      <text x="700" y="-85">111000</text>
      <text x="700" y="-67">sha256</text>
      <text x="700" y="-49">grep</text>
      <text x="700" y="-31">awk</text>
      <text class="head" x="700" y="-13">FOUND</text>

      <animateTransform
        attributeName="transform"
        type="translate"
        from="0 0"
        to="0 244"
        dur="9.7s"
        repeatCount="indefinite"
      />
    </g>

    <g class="r3 big">
      <text x="770" y="-77">./run</text>
      <text x="770" y="-57">010110</text>
      <text x="770" y="-37">bash</text>
      <text class="head" x="770" y="-17">$_</text>

      <animateTransform
        attributeName="transform"
        type="translate"
        from="0 0"
        to="0 190"
        dur="5.4s"
        repeatCount="indefinite"
      />
    </g>

    <g class="r2">
      <text x="828" y="-93">nmap</text>
      <text x="828" y="-74">101111</text>
      <text x="828" y="-55">-sV</text>
      <text x="828" y="-36">443/tcp</text>
      <text class="head" x="828" y="-17">open</text>

      <animateTransform
        attributeName="transform"
        type="translate"
        from="0 0"
        to="0 202"
        dur="7.6s"
        repeatCount="indefinite"
      />
    </g>

    <g class="r3">
      <text x="890" y="-70">0xBEEF</text>
      <text x="890" y="-51">kali</text>
      <text x="890" y="-32">011010</text>
      <text class="head" x="890" y="-13">root</text>

      <animateTransform
        attributeName="transform"
        type="translate"
        from="0 0"
        to="0 183"
        dur="5.7s"
        repeatCount="indefinite"
      />
    </g>

    <g class="r1 tiny">
      <text x="950" y="-108">1010</text>
      <text x="950" y="-90">tcp</text>
      <text x="950" y="-72">443</text>
      <text x="950" y="-54">syn</text>
      <text x="950" y="-36">ack</text>
      <text class="head" x="950" y="-18">0110</text>

      <animateTransform
        attributeName="transform"
        type="translate"
        from="0 0"
        to="0 228"
        dur="8.9s"
        repeatCount="indefinite"
      />
    </g>

  </g>

  <line
    x1="20"
    y1="110"
    x2="980"
    y2="110"
    stroke="#ff3131"
    stroke-opacity=".32"
    stroke-width="1"
  />

  <rect
    x="20"
    y="108"
    width="72"
    height="2"
    rx="1"
    fill="#ff3131"
    opacity=".78"
  />

  <rect
    x="908"
    y="108"
    width="72"
    height="2"
    rx="1"
    fill="#ff3131"
    opacity=".78"
  />

</svg>
