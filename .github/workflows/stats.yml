name: stats

on:
  workflow_dispatch:
  schedule:
    - cron: "0 4 * * *"
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: generate stats svg
        env:
          GH_TOKEN: ${{ github.token }}
          USERNAME: ${{ github.repository_owner }}
        run: |
          python <<'PY'
          import os
          import json
          import urllib.request
          from datetime import date, timedelta

          user = os.environ["USERNAME"]
          token = os.environ["GH_TOKEN"]

          def req(url, data=None):
              headers = {
                  "Authorization": f"Bearer {token}",
                  "User-Agent": "profile-stats"
              }

              body = None

              if data is not None:
                  body = json.dumps(data).encode()
                  headers["Content-Type"] = "application/json"

              request = urllib.request.Request(
                  url,
                  data=body,
                  headers=headers
              )

              with urllib.request.urlopen(request) as response:
                  return json.load(response)


          profile = req(f"https://api.github.com/users/{user}")

          query = """
          query($login: String!) {
            user(login: $login) {
              contributionsCollection {
                contributionCalendar {
                  totalContributions
                  weeks {
                    contributionDays {
                      date
                      contributionCount
                    }
                  }
                }
              }
            }
          }
          """

          data = req(
              "https://api.github.com/graphql",
              {
                  "query": query,
                  "variables": {
                      "login": user
                  }
              }
          )

          calendar = (
              data["data"]["user"]
              ["contributionsCollection"]
              ["contributionCalendar"]
          )

          total = calendar["totalContributions"]
          repos = profile["public_repos"]
          followers = profile["followers"]

          days = []
          by_date = {}

          for week in calendar["weeks"]:
              for day in week["contributionDays"]:
                  days.append(day)
                  by_date[day["date"]] = day["contributionCount"]


          today = date.today()
          current = today
          streak = 0

          while True:
              count = by_date.get(current.isoformat(), 0)

              if count <= 0:
                  if current == today:
                      current -= timedelta(days=1)
                      continue

                  break

              streak += 1
              current -= timedelta(days=1)


          recent = days[-30:]

          values = [
              day["contributionCount"]
              for day in recent
          ]

          labels = [
              day["date"][5:]
              for day in recent
          ]

          max_value = max(values) if max(values) > 0 else 1


          width = 760
          height = 96

          graph_x = 405
          graph_y = 29
          graph_w = 325
          graph_h = 43


          points = []

          for i, value in enumerate(values):
              x = graph_x + (
                  i / (len(values) - 1)
              ) * graph_w

              y = graph_y + graph_h - (
                  value / max_value
              ) * graph_h

              points.append((x, y))


          line_points = " ".join(
              f"{x:.1f},{y:.1f}"
              for x, y in points
          )

          area_points = (
              f"{graph_x},{graph_y + graph_h} "
              + line_points
              + f" {graph_x + graph_w},{graph_y + graph_h}"
          )


          stats = [
              (total, "contributions"),
              (repos, "repos"),
              (followers, "followers"),
              (streak, "streak")
          ]

          stat_x = [
              28,
              122,
              204,
              302
          ]

          stat_svg = ""

          for (value, label), x in zip(stats, stat_x):
              stat_svg += f"""
                <text
                  x="{x}"
                  y="49"
                  class="number"
                >{value}</text>

                <text
                  x="{x}"
                  y="65"
                  class="label"
                >{label}</text>

                <rect
                  x="{x}"
                  y="73"
                  width="20"
                  height="2"
                  rx="1"
                  fill="#ff3131"
                />
              """


          grid = ""

          for i in range(3):
              y = graph_y + (graph_h / 2) * i

              grid += f"""
                <line
                  x1="{graph_x}"
                  y1="{y:.1f}"
                  x2="{graph_x + graph_w}"
                  y2="{y:.1f}"
                  stroke="#21262d"
                  stroke-width="1"
                />
              """


          svg = f"""
          <svg
            width="{width}"
            height="{height}"
            viewBox="0 0 {width} {height}"
            xmlns="http://www.w3.org/2000/svg"
          >

            <defs>
              <linearGradient
                id="activity"
                x1="0"
                y1="0"
                x2="0"
                y2="1"
              >
                <stop
                  offset="0%"
                  stop-color="#ff3131"
                  stop-opacity=".28"
                />

                <stop
                  offset="100%"
                  stop-color="#ff3131"
                  stop-opacity="0"
                />
              </linearGradient>
            </defs>

            <style>
              text {{
                font-family:
                  "JetBrains Mono",
                  "Cascadia Code",
                  "Consolas",
                  monospace;
              }}

              .heading {{
                fill: #ff3131;
                font-size: 12px;
                font-weight: 700;
              }}

              .number {{
                fill: #f0f6fc;
                font-size: 19px;
                font-weight: 700;
              }}

              .label {{
                fill: #8b949e;
                font-size: 9px;
              }}

              .small {{
                fill: #6e7681;
                font-size: 8px;
              }}
            </style>


            <rect
              x=".5"
              y=".5"
              width="{width - 1}"
              height="{height - 1}"
              rx="8"
              fill="#0d1117"
              stroke="#30363d"
            />


            <text
              x="20"
              y="20"
              class="heading"
            >./stats</text>

            {stat_svg}


            <text
              x="{graph_x}"
              y="18"
              class="small"
            >activity · last 30 days</text>


            {grid}


            <polygon
              points="{area_points}"
              fill="url(#activity)"
            />


            <polyline
              points="{line_points}"
              fill="none"
              stroke="#ff3131"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            />


            <circle
              cx="{points[-1][0]}"
              cy="{points[-1][1]}"
              r="3"
              fill="#f0f6fc"
              stroke="#ff3131"
              stroke-width="2"
            />


            <text
              x="{graph_x}"
              y="86"
              class="small"
            >{labels[0]}</text>

            <text
              x="{graph_x + graph_w - 25}"
              y="86"
              class="small"
            >{labels[-1]}</text>

          </svg>
          """


          os.makedirs(
              "assets",
              exist_ok=True
          )

          with open(
              "assets/stats-graph.svg",
              "w",
              encoding="utf-8"
          ) as file:
              file.write(svg)

          PY

      - name: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add assets/stats-graph.svg
          git diff --cached --quiet && exit 0

          git commit -m "update stats"
          git push
