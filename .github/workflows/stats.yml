name: stats

on:
  workflow_dispatch:
  schedule:
    - cron: "0 4 * * *"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate stats
        env:
          GH_TOKEN: ${{ github.token }}
          USERNAME: ${{ github.repository_owner }}
        run: |
          python <<'PY'
          import os
          import json
          import urllib.request
          from datetime import date, timedelta

          user = os.environ["USERNAME"]
          token = os.environ["GH_TOKEN"]

          def request(url, payload=None):
              headers = {
                  "Authorization": f"Bearer {token}",
                  "User-Agent": "github-profile-stats",
                  "Accept": "application/vnd.github+json"
              }

              data = None

              if payload is not None:
                  data = json.dumps(payload).encode("utf-8")
                  headers["Content-Type"] = "application/json"

              req = urllib.request.Request(
                  url,
                  data=data,
                  headers=headers
              )

              with urllib.request.urlopen(req) as response:
                  return json.load(response)


          profile = request(
              f"https://api.github.com/users/{user}"
          )


          query = """
          query($login: String!) {
            user(login: $login) {
              contributionsCollection {
                contributionCalendar {
                  totalContributions
                  weeks {
                    contributionDays {
                      date
                      contributionCount
                    }
                  }
                }
              }
            }
          }
          """


          result = request(
              "https://api.github.com/graphql",
              {
                  "query": query,
                  "variables": {
                      "login": user
                  }
              }
          )


          calendar = (
              result["data"]["user"]
              ["contributionsCollection"]
              ["contributionCalendar"]
          )


          total = calendar["totalContributions"]
          repos = profile["public_repos"]
          followers = profile["followers"]


          days = []

          for week in calendar["weeks"]:
              for day in week["contributionDays"]:
                  days.append({
                      "date": day["date"],
                      "count": day["contributionCount"]
                  })


          by_date = {
              d["date"]: d["count"]
              for d in days
          }


          today = date.today()
          current = today
          streak = 0


          if by_date.get(current.isoformat(), 0) == 0:
              current -= timedelta(days=1)


          while by_date.get(current.isoformat(), 0) > 0:
              streak += 1
              current -= timedelta(days=1)


          recent = days[-30:]

          values = [
              d["count"]
              for d in recent
          ]

          labels = [
              d["date"][5:]
              for d in recent
          ]


          if not values:
              values = [0, 0]
              labels = ["--", "--"]


          max_value = max(values)

          if max_value == 0:
              max_value = 1


          width = 760
          height = 96

          graph_x = 405
          graph_y = 29
          graph_w = 325
          graph_h = 42


          points = []

          count = len(values)

          for i, value in enumerate(values):
              if count == 1:
                  x = graph_x
              else:
                  x = graph_x + (
                      i / (count - 1)
                  ) * graph_w

              y = graph_y + graph_h - (
                  value / max_value
              ) * graph_h

              points.append((x, y))


          line_points = " ".join(
              f"{x:.1f},{y:.1f}"
              for x, y in points
          )


          area_points = (
              f"{graph_x},{graph_y + graph_h} "
              + line_points
              + f" {graph_x + graph_w},{graph_y + graph_h}"
          )


          stats = [
              (total, "contributions"),
              (repos, "repos"),
              (followers, "followers"),
              (streak, "streak")
          ]


          positions = [
              24,
              120,
              205,
              300
          ]


          metric_svg = ""


          for (value, label), x in zip(stats, positions):
              metric_svg += f"""
                <text
                  x="{x}"
                  y="48"
                  class="number"
                >{value}</text>

                <text
                  x="{x}"
                  y="65"
                  class="label"
                >{label}</text>

                <rect
                  x="{x}"
                  y="74"
                  width="20"
                  height="2"
                  rx="1"
                  fill="#ff3131"
                />
              """


          grid_svg = ""


          for i in range(3):
              y = graph_y + (
                  graph_h / 2
              ) * i

              grid_svg += f"""
                <line
                  x1="{graph_x}"
                  y1="{y:.1f}"
                  x2="{graph_x + graph_w}"
                  y2="{y:.1f}"
                  stroke="#21262d"
                  stroke-width="1"
                />
              """


          first_label = labels[0]
          last_label = labels[-1]

          last_x = points[-1][0]
          last_y = points[-1][1]


          svg = f"""<svg
            width="{width}"
            height="{height}"
            viewBox="0 0 {width} {height}"
            xmlns="http://www.w3.org/2000/svg"
          >

            <defs>

              <linearGradient
                id="area"
                x1="0"
                y1="0"
                x2="0"
                y2="1"
              >

                <stop
                  offset="0%"
                  stop-color="#ff3131"
                  stop-opacity=".24"
                />

                <stop
                  offset="100%"
                  stop-color="#ff3131"
                  stop-opacity="0"
                />

              </linearGradient>

              <filter
                id="glow"
                x="-50%"
                y="-50%"
                width="200%"
                height="200%"
              >

                <feGaussianBlur
                  stdDeviation=".7"
                  result="blur"
                />

                <feMerge>
                  <feMergeNode in="blur"/>
                  <feMergeNode in="SourceGraphic"/>
                </feMerge>

              </filter>

            </defs>


            <style>

              text {{
                font-family:
                  "JetBrains Mono",
                  "Cascadia Code",
                  "Consolas",
                  monospace;
              }}

              .title {{
                fill: #ff3131;
                font-size: 12px;
                font-weight: 700;
              }}

              .number {{
                fill: #f0f6fc;
                font-size: 19px;
                font-weight: 700;
              }}

              .label {{
                fill: #8b949e;
                font-size: 9px;
              }}

              .small {{
                fill: #6e7681;
                font-size: 8px;
              }}

            </style>


            <rect
              x=".5"
              y=".5"
              width="{width - 1}"
              height="{height - 1}"
              rx="8"
              fill="#0d1117"
              stroke="#30363d"
            />


            <text
              x="20"
              y="19"
              class="title"
            >./stats</text>


            {metric_svg}


            <text
              x="{graph_x}"
              y="18"
              class="small"
            >activity · last 30 days</text>


            {grid_svg}


            <polygon
              points="{area_points}"
              fill="url(#area)"
            />


            <polyline
              points="{line_points}"
              fill="none"
              stroke="#ff3131"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              filter="url(#glow)"
            />


            <circle
              cx="{last_x:.1f}"
              cy="{last_y:.1f}"
              r="3"
              fill="#f0f6fc"
              stroke="#ff3131"
              stroke-width="2"
            />


            <text
              x="{graph_x}"
              y="86"
              class="small"
            >{first_label}</text>


            <text
              x="{graph_x + graph_w - 24}"
              y="86"
              class="small"
            >{last_label}</text>

          </svg>"""


          os.makedirs(
              "assets",
              exist_ok=True
          )


          with open(
              "assets/stats-graph-v2.svg",
              "w",
              encoding="utf-8"
          ) as file:
              file.write(svg)

          PY

      - name: Commit stats
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add assets/stats-graph-v2.svg

          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi

          git commit -m "update stats"
          git push
