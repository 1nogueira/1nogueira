name: stats

on:
  workflow_dispatch:
  schedule:
    - cron: "0 4 * * *"
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: generate stats svg
        env:
          GH_TOKEN: ${{ github.token }}
          USERNAME: ${{ github.repository_owner }}
        run: |
          python <<'PY'
          import os
          import json
          import urllib.request
          from datetime import date, timedelta

          user = os.environ["USERNAME"]
          token = os.environ["GH_TOKEN"]

          def req(url, data=None):
              headers = {
                  "Authorization": f"Bearer {token}",
                  "User-Agent": "stats-card",
                  "Accept": "application/vnd.github+json"
              }

              body = None
              if data is not None:
                  body = json.dumps(data).encode()
                  headers["Content-Type"] = "application/json"

              request = urllib.request.Request(url, data=body, headers=headers)

              with urllib.request.urlopen(request) as response:
                  return json.load(response)

          profile = req(f"https://api.github.com/users/{user}")

          query = """
          query($login: String!) {
            user(login: $login) {
              contributionsCollection {
                contributionCalendar {
                  totalContributions
                  weeks {
                    contributionDays {
                      date
                      contributionCount
                    }
                  }
                }
              }
            }
          }
          """

          data = req(
              "https://api.github.com/graphql",
              {
                  "query": query,
                  "variables": {"login": user}
              }
          )

          cal = data["data"]["user"]["contributionsCollection"]["contributionCalendar"]
          weeks = cal["weeks"]
          total_contributions = cal["totalContributions"]

          followers = profile["followers"]
          repos = profile["public_repos"]

          days = []
          day_map = {}

          for week in weeks:
              for d in week["contributionDays"]:
                  days.append(d)
                  day_map[d["date"]] = d["contributionCount"]

          today = date.today()
          streak = 0
          cur = today

          while True:
              count = day_map.get(cur.isoformat(), 0)

              if count <= 0:
                  if cur == today:
                      cur -= timedelta(days=1)
                      continue
                  break

              streak += 1
              cur -= timedelta(days=1)

          def month_shift(year, month, offset):
              total = year * 12 + (month - 1) + offset
              new_year = total // 12
              new_month = total % 12 + 1
              return new_year, new_month

          month_names = [
              "jan", "feb", "mar", "apr", "may", "jun",
              "jul", "aug", "sep", "oct", "nov", "dec"
          ]

          months = []
          for i in range(-11, 1):
              y, m = month_shift(today.year, today.month, i)
              months.append((y, m))

          monthly_totals = {f"{y:04d}-{m:02d}": 0 for y, m in months}

          for d in days:
              key = d["date"][:7]
              if key in monthly_totals:
                  monthly_totals[key] += d["contributionCount"]

          values = [monthly_totals[f"{y:04d}-{m:02d}"] for y, m in months]
          labels = [month_names[m - 1] for _, m in months]

          max_val = max(values) if max(values) > 0 else 1

          width = 760
          height = 120

          chart_x = 420
          chart_y = 22
          chart_w = 310
          chart_h = 68

          def esc(s):
              return str(s).replace("&", "&amp;").replace("<", "&lt;").replace(">", "&gt;")

          metric_positions = [
              (26, "contributions", total_contributions),
              (130, "repos", repos),
              (224, "followers", followers),
              (316, "streak", streak),
          ]

          metric_svg = []
          for x, label, value in metric_positions:
              metric_svg.append(f'''
                <text x="{x}" y="48" class="num">{esc(value)}</text>
                <text x="{x}" y="68" class="label">{esc(label)}</text>
                <rect x="{x}" y="79" width="24" height="2" rx="1" fill="#ff3131" />
              ''')

          grid = []
          for gy in range(4):
              y = chart_y + gy * (chart_h / 3)
              grid.append(
                  f'<line x1="{chart_x}" y1="{y:.1f}" x2="{chart_x + chart_w}" y2="{y:.1f}" stroke="#21262d" stroke-width="1" />'
              )

          point_step = chart_w / (len(values) - 1) if len(values) > 1 else chart_w
          points = []

          for i, value in enumerate(values):
              x = chart_x + i * point_step
              y = chart_y + chart_h - ((value / max_val) * chart_h)
              points.append((x, y, value))

          line_path = "M " + " L ".join(f"{x:.1f} {y:.1f}" for x, y, _ in points)
          area_path = (
              line_path
              + f" L {points[-1][0]:.1f} {chart_y + chart_h:.1f}"
              + f" L {points[0][0]:.1f} {chart_y + chart_h:.1f} Z"
          )

          points_svg = []
          for i, (x, y, value) in enumerate(points):
              radius = 3.2 if i == len(points) - 1 else 2.2
              fill = "#f0f6fc" if i == len(points) - 1 else "#ff3131"
              stroke = "#ff3131"
              stroke_width = "2" if i == len(points) - 1 else "0"
              points_svg.append(
                  f'<circle cx="{x:.1f}" cy="{y:.1f}" r="{radius}" fill="{fill}" stroke="{stroke}" stroke-width="{stroke_width}" />'
              )

          labels_svg = []
          for i, label in enumerate(labels):
              x = chart_x + i * point_step
              labels_svg.append(
                  f'<text x="{x:.1f}" y="108" text-anchor="middle" class="small">{label}</text>'
              )

          svg = f'''<svg width="{width}" height="{height}" viewBox="0 0 {width} {height}" xmlns="http://www.w3.org/2000/svg">
            <style>
              .title {{
                font-family: "JetBrains Mono", "Consolas", monospace;
                font-size: 18px;
                fill: #ff3131;
                font-weight: 600;
              }}

              .num {{
                font-family: "JetBrains Mono", "Consolas", monospace;
                font-size: 22px;
                fill: #f0f6fc;
                font-weight: 700;
              }}

              .label {{
                font-family: "JetBrains Mono", "Consolas", monospace;
                font-size: 11px;
                fill: #8b949e;
              }}

              .small {{
                font-family: "JetBrains Mono", "Consolas", monospace;
                font-size: 9px;
                fill: #8b949e;
              }}
            </style>

            <rect x="0.5" y="0.5" width="{width-1}" height="{height-1}" rx="10" fill="#0d1117" stroke="#30363d" />

            <text x="24" y="26" class="title">./stats</text>

            {''.join(metric_svg)}

            <line x1="400" y1="20" x2="400" y2="96" stroke="#30363d" stroke-width="1" />

            <text x="{chart_x}" y="16" class="small">activity · last 12 months</text>

            {''.join(grid)}

            <path d="{area_path}" fill="#ff3131" opacity="0.10" />
            <path d="{line_path}" fill="none" stroke="#ff3131" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />

            {''.join(points_svg)}
            {''.join(labels_svg)}
          </svg>'''

          os.makedirs("assets", exist_ok=True)
          with open("assets/stats-graph-v2.svg", "w", encoding="utf-8") as f:
              f.write(svg)
          PY

      - name: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add assets/stats-graph-v2.svg
          git diff --cached --quiet && exit 0

          git commit -m "update stats graph"
          git push
