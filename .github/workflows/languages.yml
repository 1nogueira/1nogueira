name: languages

on:
  workflow_dispatch:
  schedule:
    - cron: "15 4 * * *"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate languages card
        env:
          GH_TOKEN: ${{ github.token }}
          USERNAME: ${{ github.repository_owner }}
        run: |
          python <<'PY'
          import os
          import json
          import urllib.request
          import urllib.parse

          user = os.environ["USERNAME"]
          token = os.environ["GH_TOKEN"]

          def request(url):
              req = urllib.request.Request(
                  url,
                  headers={
                      "Authorization": f"Bearer {token}",
                      "User-Agent": "github-profile-languages",
                      "Accept": "application/vnd.github+json"
                  }
              )

              with urllib.request.urlopen(req) as response:
                  return json.load(response)

          repos = []
          page = 1

          while True:
              url = (
                  f"https://api.github.com/users/{user}/repos"
                  f"?per_page=100&page={page}&type=owner"
              )

              result = request(url)

              if not result:
                  break

              repos.extend(result)

              if len(result) < 100:
                  break

              page += 1

          totals = {}

          for repo in repos:
              if repo.get("fork"):
                  continue

              if repo.get("archived"):
                  continue

              if repo["name"].lower() == user.lower():
                  continue

              languages = request(repo["languages_url"])

              for language, amount in languages.items():
                  totals[language] = totals.get(language, 0) + amount

          if not totals:
              totals = {
                  "No data": 1
              }

          ordered = sorted(
              totals.items(),
              key=lambda item: item[1],
              reverse=True
          )

          top = ordered[:5]

          top_total = sum(
              amount
              for _, amount in top
          )

          languages = []

          for name, amount in top:
              percentage = (
                  amount / top_total
              ) * 100

              languages.append(
                  (
                      name,
                      percentage
                  )
              )

          width = 760
          height = 96

          positions = [
              24,
              170,
              316,
              462,
              608
          ]

          blocks = ""

          for (name, percentage), x in zip(
              languages,
              positions
          ):
              display = name

              if len(display) > 13:
                  display = display[:12] + "…"

              bar_width = max(
                  18,
                  min(
                      100,
                      percentage * 2.2
                  )
              )

              blocks += f"""
                <text
                  x="{x}"
                  y="48"
                  class="number"
                >{percentage:.1f}%</text>

                <text
                  x="{x}"
                  y="65"
                  class="label"
                >{display}</text>

                <rect
                  x="{x}"
                  y="74"
                  width="100"
                  height="2"
                  rx="1"
                  fill="#21262d"
                />

                <rect
                  x="{x}"
                  y="74"
                  width="{bar_width:.1f}"
                  height="2"
                  rx="1"
                  fill="#ff3131"
                />
              """

          svg = f"""<svg
            width="{width}"
            height="{height}"
            viewBox="0 0 {width} {height}"
            xmlns="http://www.w3.org/2000/svg"
          >

            <style>
              text {{
                font-family:
                  "JetBrains Mono",
                  "Cascadia Code",
                  "Consolas",
                  monospace;
              }}

              .title {{
                fill: #ff3131;
                font-size: 12px;
                font-weight: 700;
              }}

              .number {{
                fill: #f0f6fc;
                font-size: 17px;
                font-weight: 700;
              }}

              .label {{
                fill: #8b949e;
                font-size: 9px;
              }}

              .small {{
                fill: #6e7681;
                font-size: 8px;
              }}
            </style>

            <rect
              x=".5"
              y=".5"
              width="{width - 1}"
              height="{height - 1}"
              rx="8"
              fill="#0d1117"
              stroke="#30363d"
            />

            <text
              x="20"
              y="19"
              class="title"
            >./languages</text>

            <text
              x="656"
              y="19"
              class="small"
            >top languages</text>

            {blocks}

          </svg>"""

          os.makedirs(
              "assets",
              exist_ok=True
          )

          with open(
              "assets/languages-card.svg",
              "w",
              encoding="utf-8"
          ) as file:
              file.write(svg)

          PY

      - name: Commit languages card
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add assets/languages-card.svg

          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi

          git commit -m "update languages"
          git push
