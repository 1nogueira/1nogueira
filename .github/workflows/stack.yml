name: stack card

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: generate stack card
        run: |
          python <<'PY'
          import os
          import base64
          import urllib.request
          import time

          W = 760
          H = 96

          bg = "#0d1117"
          border = "#30363d"
          red = "#ff3131"
          text = "#f0f6fc"
          pill = "#21262d"

          base = "https://raw.githubusercontent.com/tandpfun/skill-icons/main/icons/"

          urls = {
              "js": base + "JavaScript.svg",
              "ts": base + "TypeScript.svg",
              "py": base + "Python-Dark.svg",
              "go": base + "GoLang.svg",
              "php": base + "PHP-Dark.svg",
              "rust": base + "Rust.svg",

              "linux": base + "Linux-Dark.svg",
              "bash": base + "Bash-Dark.svg",

              "cpp": base + "CPP.svg",
              "cs": base + "CS.svg",
              "mysql": base + "MySQL-Dark.svg",
              "kali": base + "Kali-Dark.svg"
          }


          def download(url):
              last_error = None

              for attempt in range(3):
                  try:
                      req = urllib.request.Request(
                          url,
                          headers={
                              "User-Agent": "Mozilla/5.0 GitHubActions/1nogueira",
                              "Accept": "image/svg+xml,*/*"
                          }
                      )

                      with urllib.request.urlopen(req, timeout=30) as response:
                          return response.read()

                  except Exception as error:
                      last_error = error
                      time.sleep(2)

              raise last_error


          def to_data_uri(url):
              raw = download(url)
              encoded = base64.b64encode(raw).decode("ascii")

              return "data:image/svg+xml;base64," + encoded


          icons = {}

          for name, url in urls.items():
              print("loading:", name)
              icons[name] = to_data_uri(url)


          def icon(name, x, y, size=30):
              return f'''
              <image
                href="{icons[name]}"
                x="{x}"
                y="{y}"
                width="{size}"
                height="{size}"
                preserveAspectRatio="xMidYMid meet"
              />
              '''


          def label(name, x, y, width):
              return f'''
              <rect
                x="{x}"
                y="{y}"
                width="{width}"
                height="21"
                rx="5"
                fill="{pill}"
              />

              <text
                x="{x + width / 2}"
                y="{y + 14.5}"
                text-anchor="middle"
                class="label"
              >{name}</text>
              '''


          svg = f'''<svg
            width="{W}"
            height="{H}"
            viewBox="0 0 {W} {H}"
            xmlns="http://www.w3.org/2000/svg"
          >

            <style>
              text {{
                font-family:
                  "JetBrains Mono",
                  "Cascadia Code",
                  "Consolas",
                  monospace;
              }}

              .title {{
                fill: {red};
                font-size: 13px;
                font-weight: 700;
              }}

              .label {{
                fill: {text};
                font-size: 9px;
                font-weight: 600;
              }}
            </style>


            <rect
              x=".5"
              y=".5"
              width="{W - 1}"
              height="{H - 1}"
              rx="10"
              fill="{bg}"
              stroke="{border}"
            />


            <text
              x="18"
              y="21"
              class="title"
            >./stack</text>


            {label("main", 18, 49, 40)}

            {icon("js", 68, 44)}
            {icon("ts", 102, 44)}
            {icon("py", 136, 44)}
            {icon("go", 170, 44)}
            {icon("php", 204, 44)}
            {icon("rust", 238, 44)}


            {label("sys", 292, 49, 34)}

            {icon("linux", 336, 44)}
            {icon("bash", 370, 44)}


            {label("learning", 424, 49, 64)}

            {icon("cpp", 498, 44)}
            {icon("cs", 532, 44)}
            {icon("rust", 566, 44)}
            {icon("mysql", 600, 44)}
            {icon("kali", 634, 44)}


            {label("hacking", 682, 49, 60)}


            <rect
              x="18"
              y="82"
              width="40"
              height="2"
              rx="1"
              fill="{red}"
            />

            <rect
              x="292"
              y="82"
              width="34"
              height="2"
              rx="1"
              fill="{red}"
            />

            <rect
              x="424"
              y="82"
              width="64"
              height="2"
              rx="1"
              fill="{red}"
            />

          </svg>'''


          os.makedirs("assets", exist_ok=True)

          with open(
              "assets/stack-card-v4.svg",
              "w",
              encoding="utf-8"
          ) as file:
              file.write(svg)

          print("generated assets/stack-card-v4.svg")

          PY

      - name: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add assets/stack-card-v4.svg

          if git diff --cached --quiet; then
            echo "no changes"
            exit 0
          fi

          git commit -m "update stack card"
          git push
