name: stack card

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: generate stack card
        run: |
          python <<'PY'
          import os
          import base64
          import urllib.request

          WIDTH = 760
          HEIGHT = 94

          BG = "#0d1117"
          BORDER = "#30363d"
          RED = "#ff3131"
          TEXT = "#f0f6fc"
          PILL = "#21262d"

          def download(url):
              req = urllib.request.Request(
                  url,
                  headers={
                      "User-Agent": "Mozilla/5.0",
                      "Accept": "image/svg+xml,*/*"
                  }
              )

              with urllib.request.urlopen(req, timeout=30) as response:
                  return response.read()

          def svg_data(url):
              raw = download(url)
              encoded = base64.b64encode(raw).decode("ascii")
              return f"data:image/svg+xml;base64,{encoded}"

          main_icons = svg_data(
              "https://skillicons.dev/icons?i=js,ts,py,go,php,rust&theme=dark"
          )

          sys_icons = svg_data(
              "https://skillicons.dev/icons?i=linux,bash&theme=dark"
          )

          learning_icons = svg_data(
              "https://skillicons.dev/icons?i=cpp,cs,rust,mysql&theme=dark"
          )

          kali_icon = svg_data(
              "https://cdn.simpleicons.org/kalilinux/FF3131"
          )

          def pill(text, x, y, width):
              return f"""
              <rect
                x="{x}"
                y="{y}"
                width="{width}"
                height="21"
                rx="5"
                fill="{PILL}"
              />

              <text
                x="{x + width / 2}"
                y="{y + 14}"
                text-anchor="middle"
                class="pill"
              >{text}</text>
              """

          svg = f"""<svg
            width="{WIDTH}"
            height="{HEIGHT}"
            viewBox="0 0 {WIDTH} {HEIGHT}"
            xmlns="http://www.w3.org/2000/svg"
          >

            <style>
              text {{
                font-family:
                  "JetBrains Mono",
                  "Cascadia Code",
                  "Consolas",
                  monospace;
              }}

              .title {{
                fill: {RED};
                font-size: 13px;
                font-weight: 700;
              }}

              .pill {{
                fill: {TEXT};
                font-size: 9px;
                font-weight: 600;
              }}
            </style>

            <rect
              x=".5"
              y=".5"
              width="{WIDTH - 1}"
              height="{HEIGHT - 1}"
              rx="10"
              fill="{BG}"
              stroke="{BORDER}"
            />

            <text
              x="18"
              y="21"
              class="title"
            >./stack</text>

            {pill("main", 18, 48, 40)}

            <image
              href="{main_icons}"
              x="68"
              y="40"
              width="210"
              height="38"
              preserveAspectRatio="xMidYMid meet"
            />

            {pill("sys", 302, 48, 34)}

            <image
              href="{sys_icons}"
              x="346"
              y="40"
              width="70"
              height="38"
              preserveAspectRatio="xMidYMid meet"
            />

            {pill("learning", 444, 48, 66)}

            <image
              href="{learning_icons}"
              x="520"
              y="40"
              width="140"
              height="38"
              preserveAspectRatio="xMidYMid meet"
            />

            <image
              href="{kali_icon}"
              x="668"
              y="44"
              width="30"
              height="30"
              preserveAspectRatio="xMidYMid meet"
            />

            {pill("hacking", 705, 48, 46)}

            <rect
              x="18"
              y="82"
              width="40"
              height="2"
              rx="1"
              fill="{RED}"
            />

            <rect
              x="302"
              y="82"
              width="34"
              height="2"
              rx="1"
              fill="{RED}"
            />

            <rect
              x="444"
              y="82"
              width="66"
              height="2"
              rx="1"
              fill="{RED}"
            />

          </svg>"""

          os.makedirs("assets", exist_ok=True)

          with open(
              "assets/stack-card-v3.svg",
              "w",
              encoding="utf-8"
          ) as file:
              file.write(svg)

          print("generated assets/stack-card-v3.svg")

          PY

      - name: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add assets/stack-card-v3.svg

          if git diff --cached --quiet; then
            echo "no changes"
            exit 0
          fi

          git commit -m "update stack card"
          git push
