name: stack card

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: generate stack card
        run: |
          python <<'PY'
          import os
          import base64
          import urllib.request

          W = 760
          H = 96

          bg = "#0d1117"
          border = "#30363d"
          red = "#ff3131"
          text = "#f0f6fc"
          pill = "#21262d"

          urls = {
              "js": "https://skillicons.dev/icons?i=js&theme=dark",
              "ts": "https://skillicons.dev/icons?i=ts&theme=dark",
              "py": "https://skillicons.dev/icons?i=py&theme=dark",
              "go": "https://skillicons.dev/icons?i=go&theme=dark",
              "php": "https://skillicons.dev/icons?i=php&theme=dark",
              "rust": "https://skillicons.dev/icons?i=rust&theme=dark",

              "linux": "https://skillicons.dev/icons?i=linux&theme=dark",
              "bash": "https://skillicons.dev/icons?i=bash&theme=dark",

              "cpp": "https://skillicons.dev/icons?i=cpp&theme=dark",
              "cs": "https://skillicons.dev/icons?i=cs&theme=dark",
              "mysql": "https://skillicons.dev/icons?i=mysql&theme=dark",

              "kali": "https://cdn.simpleicons.org/kalilinux/FF3131"
          }

          def fetch(url):
              req = urllib.request.Request(
                  url,
                  headers={
                      "User-Agent": "1nogueira-profile",
                      "Accept": "image/svg+xml,image/*,*/*"
                  }
              )

              with urllib.request.urlopen(req, timeout=30) as response:
                  return response.read()

          def encode_icon(url):
              raw = fetch(url)
              encoded = base64.b64encode(raw).decode("ascii")
              return f"data:image/svg+xml;base64,{encoded}"

          icons = {}

          for name, url in urls.items():
              print("loading", name)
              icons[name] = encode_icon(url)

          def icon(name, x, y, size=32):
              return f'''
              <image
                href="{icons[name]}"
                x="{x}"
                y="{y}"
                width="{size}"
                height="{size}"
                preserveAspectRatio="xMidYMid meet"
              />
              '''

          def label(name, x, y, width):
              return f'''
              <rect
                x="{x}"
                y="{y}"
                width="{width}"
                height="21"
                rx="5"
                fill="{pill}"
              />

              <text
                x="{x + width / 2}"
                y="{y + 14.5}"
                text-anchor="middle"
                class="label"
              >{name}</text>
              '''

          svg = f'''<svg
            width="{W}"
            height="{H}"
            viewBox="0 0 {W} {H}"
            xmlns="http://www.w3.org/2000/svg"
          >

            <style>
              text {{
                font-family:
                  "JetBrains Mono",
                  "Cascadia Code",
                  "Consolas",
                  monospace;
              }}

              .title {{
                fill: {red};
                font-size: 13px;
                font-weight: 700;
              }}

              .label {{
                fill: {text};
                font-size: 9px;
                font-weight: 600;
              }}
            </style>

            <rect
              x=".5"
              y=".5"
              width="{W - 1}"
              height="{H - 1}"
              rx="10"
              fill="{bg}"
              stroke="{border}"
            />

            <text
              x="18"
              y="21"
              class="title"
            >./stack</text>


            {label("main", 18, 49, 40)}

            {icon("js",   68, 43)}
            {icon("ts",  103, 43)}
            {icon("py",  138, 43)}
            {icon("go",  173, 43)}
            {icon("php", 208, 43)}
            {icon("rust",243, 43)}


            {label("sys", 301, 49, 34)}

            {icon("linux", 345, 43)}
            {icon("bash",  380, 43)}


            {label("learning", 437, 49, 66)}

            {icon("cpp",   513, 43)}
            {icon("cs",    548, 43)}
            {icon("rust",  583, 43)}
            {icon("mysql", 618, 43)}
            {icon("kali",  653, 44, 30)}


            {label("hacking", 695, 49, 54)}


            <rect
              x="18"
              y="82"
              width="40"
              height="2"
              rx="1"
              fill="{red}"
            />

            <rect
              x="301"
              y="82"
              width="34"
              height="2"
              rx="1"
              fill="{red}"
            />

            <rect
              x="437"
              y="82"
              width="66"
              height="2"
              rx="1"
              fill="{red}"
            />

          </svg>'''

          os.makedirs("assets", exist_ok=True)

          with open(
              "assets/stack-card.svg",
              "w",
              encoding="utf-8"
          ) as file:
              file.write(svg)

          print("stack card generated")

          PY

      - name: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add assets/stack-card.svg

          if git diff --cached --quiet; then
            echo "no changes"
            exit 0
          fi

          git commit -m "update stack card"
          git push
